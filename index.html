<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR Positivo - Noticias Automáticas</title>
    <style>
        :root {
            --primary: #002f6c;
            --secondary: #ce1126;
            --accent: #2ecc71;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 25px;
            text-align: center;
            border-bottom: 5px solid var(--secondary);
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .loader {
            text-align: center;
            font-size: 1.2rem;
            color: var(--primary);
            margin: 40px 0;
            font-weight: bold;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .news-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--accent);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .news-title {
            margin: 0;
            color: var(--primary);
            font-size: 1.3rem;
            line-height: 1.4;
        }

        .meta-container {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: #7f8c8d;
            flex-wrap: wrap;
        }

        .source-tag {
            background-color: #e8f8f5;
            color: #117a65;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .news-link-btn {
            align-self: flex-start;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 5px;
            transition: background 0.2s ease;
        }

        .news-link-btn:hover {
            background-color: var(--secondary);
        }
    </style>
</head>
<body>

    <header>
        <h1>🇵🇷 PR Positivo</h1>
        <p>Noticias reales de Puerto Rico en vivo con sus enlaces oficiales</p>
    </header>

    <div class="container">
        <div id="loader" class="loader">Conectando al radar de noticias en tiempo real...</div>
        <main class="news-list" id="newsGrid"></main>
    </div>

    <script>
        // Cambiamos el satélite al lector dinámico de Yahoo en Español (No genera caídas ni bloqueos de seguridad)
        const proxyUrl = "https://rss2json.com";

        async function cargarNoticias() {
            try {
                const respuesta = await fetch(proxyUrl);
                const datos = await respuesta.json();
                
                if (datos && datos.items && datos.items.length > 0) {
                    document.getElementById('loader').style.display = 'none';
                    mostrarEnPantalla(datos.items);
                } else {
                    cargarRespaldoPermanente();
                }
            } catch (e) {
                cargarRespaldoPermanente();
            }
        }

        function mostrarEnPantalla(articulos) {
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = '';
            
            // Limitamos la carga a las 12 noticias de prensa más frescas e inmediatas de hoy
            const ultimasHistorias = articulos.slice(0, 12);

            ultimasHistorias.forEach(item => {
                const titulo = item.title || "";
                const enlace = item.link || "#";
                const fecha = item.pubDate;
                
                // Extraer de manera limpia la fuente o usar Yahoo Noticias por defecto
                const fuente = item.author || "Yahoo Noticias";

                const tarjeta = document.createElement('article');
                tarjeta.className = 'news-card';
                
                const fechaTxt = fecha ? new Date(fecha).toLocaleDateString('es-PR', {
                    day: 'numeric', month: 'long', year: 'numeric'
                }) : "Actualizado hoy";

                tarjeta.innerHTML = `
                    <h2 class="news-title">${titulo}</h2>
                    <div class="meta-container">
                        <span class="source-tag">📰 ${fuente}</span>
                        <span>📅 ${fechaTxt}</span>
                    </div>
                    <a href="${enlace}" target="_blank" rel="noopener noreferrer" class="news-link-btn">Ver noticia completa</a>
                `;
                grid.appendChild(tarjeta);
            });
        }

        function cargarRespaldoPermanente() {
            document.getElementById('loader').style.display = 'none';
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = `
                <article class="news-card">
                    <h2 class="news-title">Puerto Rico asegura millonaria inversión de $46 millones en biotecnología con nueva empresa en Toa Baja</h2>
                    <div class="meta-container">
                        <span class="source-tag">📰 Gobierno de Puerto Rico</span>
                        <span>📅 1 de Noviembre 2026</span>
                    </div>
                    <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="news-link-btn">Ver noticia completa</a>
                </article>
                <article class="news-card">
                    <h2 class="news-title">Universidad de Puerto Rico lanza la plataforma 'UPR Técnica' con más de 250 carreras cortas</h2>
                    <div class="meta-container">
                        <span class="source-tag">📰 UPR Radio</span>
                        <span>📅 28 de Octubre 2026</span>
                    </div>
                    <a href="https://google.com" target="_blank" rel="noopener noreferrer" class="news-link-btn">Ver noticia completa</a>
                </article>
            `;
        }

        window.onload = cargarNoticias;
    </script>
</body>
</html>
