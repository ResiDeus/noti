<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR Positivo - Noticias Automáticas</title>
    <style>
        :root {
            --primary: #002f6c;
            --secondary: #ce1126;
            --accent: #2ecc71;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 5px solid var(--secondary);
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .loader {
            text-align: center;
            font-size: 1.2rem;
            color: var(--primary);
            margin: 40px 0;
            font-weight: bold;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .news-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--accent);
            animation: fadeIn 0.5s ease;
        }

        .news-title {
            margin: 0 0 10px 0;
            color: var(--primary);
        }

        .news-title a {
            color: inherit;
            text-decoration: none;
        }

        .news-title a:hover {
            text-decoration: underline;
        }

        .news-date {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>🇵🇷 PR Positivo en Vivo</h1>
        <p>Noticias de Puerto Rico filtradas automáticamente para mostrar solo lo bueno</p>
    </header>

    <div class="container">
        <div id="loader" class="loader">Buscando buenas noticias en tiempo real...</div>
        <main class="news-list" id="newsGrid"></main>
    </div>

    <script>
        // Filtros estrictos para capturar únicamente historias constructivas e inspiradoras
        const palabrasPositivas = [
            "gana", "premio", "logra", "brilla", "triunfo", "ayuda", "comunidad", 
            "éxito", "oro", "medalla", "avance", "descubren", "donación", "escolar", 
            "deporte", "arte", "música", "talento", "histórico", "crea", "inauguran",
            "orgullo", "reconocen", "celebran", "solidaridad", "festival", "bienestar"
        ];

        // Usamos una fuente alternativa abierta de noticias de PR para evitar problemas de bloqueo
        const rssUrl = "https://google.com";
        // Convertidor libre de CORS para cargar los datos de forma segura
        const apiUrl = `https://allorigins.win{encodeURIComponent(rssUrl)}`;

        async function cargarNoticiasAutomatica() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                // Parsear el string XML recibido
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data.contents, "text/xml");
                const articulos = xmlDoc.getElementsByTagName("item");

                if (articulos.length > 0) {
                    document.getElementById('loader').style.display = 'none';
                    filtrarYMostrar(articulos);
                } else {
                    mostrarError();
                }
            } catch (error) {
                mostrarError();
            }
        }

        function filtrarYMostrar(articulos) {
            const grid = document.getElementById('newsGrid');
            let contador = 0;

            for (let i = 0; i < articulos.length; i++) {
                const title = articulos[i].getElementsByTagName("title")[0]?.textContent || "";
                const link = articulos[i].getElementsByTagName("link")[0]?.textContent || "#";
                const pubDate = articulos[i].getElementsByTagName("pubDate")[0]?.textContent || "";
                
                const contenidoParaAnalizar = title.toLowerCase();
                
                // Evalúa si el titular incluye alguna de nuestras palabras clave de optimismo
                const esPositiva = palabrasPositivas.some(palabra => contenidoParaAnalizar.includes(palabra));

                if (esPositiva) {
                    contador++;
                    const card = document.createElement('article');
                    card.className = 'news-card';
                    
                    const fecha = new Date(pubDate).toLocaleDateString('es-PR', {
                        day: 'numeric', month: 'long', year: 'numeric'
                    });

                    card.innerHTML = `
                        <h2 class="news-title">
                            <a href="${link}" target="_blank" rel="noopener noreferrer">${title}</a>
                        </h2>
                        <div class="news-date">📅 ${fecha}</div>
                        <p>Haz clic en el titular para leer la historia completa en su fuente oficial de noticias.</p>
                    `;
                    grid.appendChild(card);
                }
            }

            if (contador === 0) {
                grid.innerHTML = "<p style='text-align:center;'>Buscando noticias... Si no aparecen de inmediato, refresca la página en unos minutos.</p>";
            }
        }

        function mostrarError() {
            document.getElementById('loader').innerText = "Conectando con el servidor de noticias... Por favor, refresca la página.";
        }

        window.onload = cargarNoticiasAutomatica;
    </script>
</body>
</html>
