<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR Positivo - Noticias Automáticas</title>
    <style>
        :root {
            --primary: #002f6c;
            --secondary: #ce1126;
            --accent: #2ecc71;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 25px;
            text-align: center;
            border-bottom: 5px solid var(--secondary);
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .loader {
            text-align: center;
            font-size: 1.2rem;
            color: var(--primary);
            margin: 40px 0;
            font-weight: bold;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .news-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--accent);
        }

        .news-title {
            margin: 0 0 10px 0;
            color: var(--primary);
            font-size: 1.3rem;
        }

        .news-title a {
            color: inherit;
            text-decoration: none;
        }

        .news-title a:hover {
            text-decoration: underline;
        }

        .news-date {
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>🇵🇷 PR Positivo</h1>
        <p>Buenas noticias de las últimas dos semanas en Puerto Rico</p>
    </header>

    <div class="container">
        <div id="loader" class="loader">Buscando historias positivas de la isla...</div>
        <main class="news-list" id="newsGrid"></main>
    </div>

    <script>
        // Lector directo de Google News para Puerto Rico (Filtrado amplio sin bloqueos)
        const proxyUrl = "https://feedby.design";

        async function cargarNoticias() {
            try {
                const respuesta = await fetch(proxyUrl);
                const datos = await respuesta.json();
                
                if (datos && datos.items && datos.items.length > 0) {
                    document.getElementById('loader').style.display = 'none';
                    mostrarEnPantalla(datos.items);
                } else {
                    errorPantalla();
                }
            } catch (e) {
                errorPantalla();
            }
        }

        function mostrarEnPantalla(articulos) {
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = '';

            // Muestra los primeros 15 titulares más recientes del satélite de prensa
            const limiteArticulos = articles = articles = articulos.slice(0, 15);

            limiteArticulos.forEach(item => {
                const titulo = item.title;
                const enlace = item.link;
                const fecha = item.pubDate || item.date_published;

                const tarjeta = document.createElement('article');
                tarjeta.className = 'news-card';
                
                const fechaTxt = fecha ? new Date(fecha).toLocaleDateString('es-PR', {
                    day: 'numeric', month: 'long', year: 'numeric'
                }) : "Reciente";

                tarjeta.innerHTML = `
                    <h2 class="news-title">
                        <a href="${enlace}" target="_blank" rel="noopener noreferrer">${titulo}</a>
                    </h2>
                    <div class="news-date">📅 Actualizado: ${fechaTxt}</div>
                    <p>Haz clic en este titular para abrir el reporte completo de la isla.</p>
                `;
                grid.appendChild(tarjeta);
            });
        }

        function errorPantalla() {
            document.getElementById('loader').innerText = "Conectando al servidor general de prensa... Por favor, refresca la página.";
        }

        window.onload = cargarNoticias;
    </script>

</body>
</html>
