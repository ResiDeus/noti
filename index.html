<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR Positivo - Noticias en Vivo</title>
    <style>
        :root {
            --primary: #002f6c;
            --secondary: #ce1126;
            --accent: #2ecc71;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 25px;
            text-align: center;
            border-bottom: 5px solid var(--secondary);
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .loader {
            text-align: center;
            font-size: 1.2rem;
            color: var(--primary);
            margin: 40px 0;
            font-weight: bold;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .news-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--accent);
        }

        .news-title {
            margin: 0 0 10px 0;
            color: var(--primary);
            font-size: 1.4rem;
        }

        .news-title a {
            color: inherit;
            text-decoration: none;
        }

        .news-title a:hover {
            text-decoration: underline;
        }

        .news-date {
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>🇵🇷 PR Positivo</h1>
        <p>Titulares reales de Puerto Rico filtrados de forma automática</p>
    </header>

    <div class="container">
        <div id="loader" class="loader">Buscando historias positivas de la isla...</div>
        <main class="news-list" id="newsGrid"></main>
    </div>

    <script>
        // Filtros estrictos para capturar solo lo alegre e inspirador
        const palabrasBuenas = [
            "gana", "premio", "logra", "brilla", "triunfo", "ayuda", "comunidad", 
            "éxito", "oro", "medalla", "avance", "donación", "escolar", "turismo",
            "deporte", "arte", "música", "talento", "histórico", "crea", "inauguran",
            "orgullo", "reconocen", "celebran", "solidaridad", "festival", "bienestar"
        ];

        // Lector universal de noticias de Google News (Evita bloqueos de seguridad del navegador)
        const googleNewsUrl = "https://google.com";
        const proxyUrl = `https://rss2json.com{encodeURIComponent(googleNewsUrl)}&api_key=4xb6v8o8z606rbtuolb4qg9n8mclofhpx3fmxp5k`;

        async function cargarNoticias() {
            try {
                const respuesta = await fetch(proxyUrl);
                const datos = await respuesta.json();
                
                if (datos.status === 'ok' && datos.items.length > 0) {
                    document.getElementById('loader').style.display = 'none';
                    mostrarEnPantalla(datos.items);
                } else {
                    errorPantalla();
                }
            } catch (e) {
                errorPantalla();
            }
        }

        function mostrarEnPantalla(articulos) {
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = '';
            let contador = 0;

            articulos.forEach(item => {
                const titulo = item.title;
                const enlace = item.link;
                const fecha = item.pubDate;
                const minuscula = titulo.toLowerCase();

                // Analizar si el titular de prensa es positivo
                const esBuenaNoticia = palabrasBuenas.some(p => minuscula.includes(p));

                if (esBuenaNoticia) {
                    contador++;
                    const tarjeta = document.createElement('article');
                    tarjeta.className = 'news-card';
                    
                    const fechaTxt = new Date(fecha).toLocaleDateString('es-PR', {
                        day: 'numeric', month: 'long', year: 'numeric'
                    });

                    tarjeta.innerHTML = `
                        <h2 class="news-title">
                            <a href="${enlace}" target="_blank" rel="noopener noreferrer">${titulo}</a>
                        </h2>
                        <div class="news-date">📅 Publicado: ${fechaTxt}</div>
                    `;
                    grid.appendChild(tarjeta);
                }
            });

            if (contador === 0) {
                grid.innerHTML = "<p style='text-align:center;'>Buscando noticias... Intenta recargar la página en unos minutos.</p>";
            }
        }

        function errorPantalla() {
            document.getElementById('loader').innerText = "Cargando titulares del satélite... Por favor refresca la página.";
        }

        window.onload = cargarNoticias;
    </script>
</body>
</html>
